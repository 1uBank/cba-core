name: deploy-dev

on:
  push:
    branches: [dev]

permissions:
  id-token: write  
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cba-core-dev        
  ECS_CLUSTER: cba-core-dev
  ECS_SERVICE: cba-core-dev
  TASK_FAMILY: cba-core-dev
  CONTAINER_NAME: cba-core

jobs:
  build-and-push:
    runs-on: ubuntu-latest       
    timeout-minutes: 45
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
      - name: Show GitHub OIDC context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Event: $GITHUB_EVENT_NAME"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::612457065814:role/cba-core-dev-gha-deploy
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: image
        run: echo "image=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push with Jib
        run: ./gradlew :fineract-provider:jib -Djib.to.image=${{ steps.image.outputs.image }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build-and-push.outputs.image }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 30

      # Optional smoke test: set repo variable DEV_BASE_URL (e.g. https://cba-dev.example.com)
      # and make sure the ALB security group allows GitHub's runners (or run it from inside your network).
     # - name: Smoke test
       # if: ${{ vars.DEV_BASE_URL != '' }}
       # run: |
        #  curl --fail --silent --show-error --retry 10 --retry-delay 15 --retry-connrefused \
         #   "${{ vars.DEV_BASE_URL }}/fineract-provider/actuator/health/readiness"
